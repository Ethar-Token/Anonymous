<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow video pro</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>

<script>
// ===== EDIT YOUR TEXT HERE =====
const T = {
  s1: "Let’s connect. 🤍",
  s2: "I promise I don’t bite 😂",
  s3: "I know how to press the follow back button 😭",
  s4top: "Try me…",
  s4bottom: "I'll follow back 😂",
  s5: "Follow for daily anonymous confessions",
  search: "Search “Anonymous Confessions by Ethar” on Google"
};
// ===============================

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const ACCENT = '#ff3b6b';
const FAM = 'system-ui, "Segoe UI", Roboto, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const outBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const rnd = i => { const s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); };

function wrap(text, size, maxW) {
  ctx.font = `800 ${size}px ${FAM}`;
  const out = []; let cur = '';
  for (const w of text.split(' ')) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { out.push(cur); cur = w; } else cur = test;
  }
  if (cur) out.push(cur);
  return out;
}

// Rows slam in one after another with a punchy overshoot
function slam(text, cy, size, local, color = '#fff', sceneA = 1) {
  const rows = wrap(text, size, W - 180);
  const lh = size * 1.22, y0 = cy - ((rows.length - 1) * lh) / 2;
  rows.forEach((r, k) => {
    const p = clamp((local - k * 0.22) / 0.45);
    if (p <= 0) return;
    const s = 1.8 - 0.8 * outBack(p);
    ctx.save();
    ctx.globalAlpha = sceneA * clamp(p * 3);
    ctx.translate(W / 2, y0 + k * lh);
    ctx.rotate((1 - p) * 0.12 * (k % 2 ? 1 : -1));
    ctx.scale(s, s);
    ctx.font = `800 ${size}px ${FAM}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(r, 0, 0);
    ctx.restore();
  });
}

function ring(local, delay, color, a) {
  const p = clamp((local - delay) / 0.8);
  if (p <= 0 || p >= 1) return;
  ctx.save();
  ctx.globalAlpha = a * (1 - p) * 0.6;
  ctx.strokeStyle = color; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 150 + outCubic(p) * 650, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function button(label, cx, cy, filled, scale, a) {
  const w = 620, h = 170;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 34);
  if (filled) { ctx.fillStyle = ACCENT; ctx.fill(); }
  else { ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; ctx.stroke(); }
  ctx.fillStyle = '#fff'; ctx.font = `800 70px ${FAM}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, 0, 4);
  ctx.restore();
}

const EMOJI = ['🤍', '😂', '😭', '🔥', '🤫', '👀'];
function confetti(local, a) {
  for (let i = 0; i < 70; i++) {
    const tau = local - 0.1 - rnd(i + 3) * 0.15;
    if (tau <= 0) continue;
    const ang = rnd(i) * Math.PI * 2, sp = 500 + rnd(i + 9) * 950;
    const x = W / 2 + Math.cos(ang) * sp * tau;
    const y = H * 0.5 + Math.sin(ang) * sp * tau - 500 * tau + 900 * tau * tau;
    ctx.save();
    ctx.globalAlpha = a * clamp(1 - (tau - 2) / 1);
    ctx.translate(x, y); ctx.rotate(tau * (rnd(i + 5) - .5) * 8);
    ctx.font = `${55 + rnd(i + 7) * 55}px ${FAM}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(EMOJI[i % EMOJI.length], 0, 0);
    ctx.restore();
  }
}

// ---- Scenes: [duration, render(local, sceneAlpha)] ----
const scenes = [
  [2.0, (l, a) => { ring(l, 0, '#fff', a); slam(T.s1, H / 2, 120, l, '#fff', a); }],

  [2.2, (l, a) => {
    slam(T.s2, H / 2, 112, l, '#fff', a);
    // wobbling emoji bite-marks of innocence
    ctx.save(); ctx.globalAlpha = a * clamp((l - .6) / .3);
    ctx.translate(W / 2, H / 2 + 330); ctx.rotate(Math.sin(l * 9) * 0.25);
    ctx.font = `200px ${FAM}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('😇', 0, 0); ctx.restore();
  }],

  [3.2, (l, a) => {
    slam(T.s3, 620, 100, l, '#fff', a);
    const show = clamp((l - 1.0) / .35);
    const tap = l > 1.9;
    const sq = tap ? 1 - 0.12 * Math.sin(clamp((l - 1.9) / .25) * Math.PI) : 1;
    button(tap ? 'Following ✓' : 'Follow back', W / 2, 1250, !tap, outBack(show) * sq, a * show);
    if (tap) { // tap ripple
      const p = clamp((l - 1.9) / .6);
      ctx.save(); ctx.globalAlpha = a * (1 - p); ctx.strokeStyle = ACCENT; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.arc(W / 2, 1250, 90 + p * 260, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  }],

  [3.0, (l, a) => {
    slam(T.s4top, 560, 130, l, '#fff', a);
    const v = Math.round(1000000 * inOut(clamp((l - .3) / 1.9)));
    const pulse = l > 2.2 ? 1 + 0.05 * Math.sin((l - 2.2) * 18) : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H / 2 + 20); ctx.scale(pulse, pulse);
    ctx.font = `800 190px ${FAM}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = ACCENT; ctx.fillText(v.toLocaleString('en-US'), 0, 0); ctx.restore();
    slam(T.s4bottom, 1330, 96, Math.max(0, l - 2.1), '#fff', a);
  }],

  [4.2, (l, a) => {
    ring(l, 0, ACCENT, a);
    slam(T.s5, 820, 120, l, '#fff', a);
    // underline sweeps across
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = ACCENT;
    const w = 700 * outCubic(clamp((l - 1.1) / .5));
    ctx.fillRect(W / 2 - w / 2, 1180, w, 14); ctx.restore();
    ctx.save(); ctx.globalAlpha = a * clamp((l - 1.6) / .4);
    ctx.font = `600 52px ${FAM}`; ctx.textAlign = 'center'; ctx.fillStyle = '#ccc';
    ctx.fillText(T.search, W / 2, 1300); ctx.restore();
    confetti(l, a);
  }]
];
const TOTAL = scenes.reduce((s, x) => s + x[0], 0);

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // soft pulsing glow
  const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 1000);
  g.addColorStop(0, 'rgba(255,59,107,' + (0.16 + 0.06 * Math.sin(t * 3)) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  let acc = 0;
  for (let i = 0; i < scenes.length; i++) {
    const [d, fn] = scenes[i];
    if (t < acc + d || i === scenes.length - 1) {
      const l = t - acc;
      const a = clamp((d - l) / 0.2);          // fade out at end of scene
      const shake = Math.max(0, 1 - l / 0.3) * 16 * Math.sin(l * 90);
      ctx.save(); ctx.translate(shake, -shake * 0.6);
      fn(l, i === scenes.length - 1 ? clamp((TOTAL - t) / 0.3) : a);
      ctx.restore();
      break;
    }
    acc += d;
  }
}

let t0 = performance.now();
(function tick(now) {
  draw(((now - t0) / 1000) % TOTAL);
  requestAnimationFrame(tick);
})(t0);

document.addEventListener('click', () => { t0 = performance.now(); });
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'f' && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
});
</script>
</body>
</html>
