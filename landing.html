
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anonymous — Say It Here</title>

<meta name="theme-color" content="#090510">
<meta name="description" content="Anonymous — Say It Here. A space to share confessions, secrets and thoughts anonymously.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --purple: #a855f7;
    --violet: #7928ca;
    --pink: #e044d5;
    --white: #ffffff;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Poppins", sans-serif;
    background: #090510;
    color: var(--white);
    overflow: hidden;
}

.landing {
    min-height: 100svh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(91, 13, 151, .19),
            transparent 55%
        ),
        linear-gradient(
            145deg,
            #10051e,
            #08040f 55%,
            #10051e
        );
}

/* Atmospheric purple lighting */

.glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: -1;
}

.glow-one {
    width: 350px;
    height: 350px;
    background: rgba(115, 0, 255, .28);
    top: -190px;
    left: -130px;
}

.glow-two {
    width: 300px;
    height: 300px;
    background: rgba(206, 0, 255, .17);
    bottom: -170px;
    right: -100px;
}

/* Decorative background curves */

.curve {
    position: absolute;
    width: 120%;
    height: 230px;
    border: 1px solid rgba(150, 45, 255, .18);
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
}

.curve-top {
    top: -180px;
    left: -10%;
    transform: rotate(-12deg);
    box-shadow:
        0 0 35px rgba(120, 0, 255, .12);
}

.curve-bottom {
    bottom: -190px;
    right: -10%;
    transform: rotate(-12deg);
    box-shadow:
        0 0 35px rgba(190, 0, 255, .12);
}

/* Main branding */

.brand {
    width: min(90%, 520px);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px;
    animation: appear 1.2s ease both;
}

/* Circular logo */

.logo-circle {
    width: 142px;
    height: 142px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;

    background:
        linear-gradient(
            135deg,
            #8b38ff,
            #c52be8 55%,
            #f02cae
        );

    border: 2px solid rgba(255,255,255,.35);

    box-shadow:
        0 0 15px rgba(181, 49, 255, .65),
        0 0 45px rgba(147, 35, 255, .35),
        inset 0 0 25px rgba(255,255,255,.13);

    margin-bottom: 30px;

    animation: logoGlow 3s ease-in-out infinite;
}

.logo-circle svg {
    width: 91px;
    height: 91px;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.15));
}

/* Brand name */

.brand-name {
    font-size: clamp(38px, 9vw, 64px);
    font-weight: 800;
    letter-spacing: -2.5px;
    line-height: 1.15;

    background: linear-gradient(
        100deg,
        #ffffff,
        #f3e7ff,
        #d6a6ff
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    text-shadow: 0 0 35px rgba(177, 89, 255, .13);
}

/* Tagline */

.tagline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 17px;
    margin-top: 20px;
    width: 100%;
}

.tagline-line {
    height: 1px;
    flex: 1;
    max-width: 90px;
    background: linear-gradient(
        90deg,
        transparent,
        #a33df4
    );
}

.tagline-line:last-child {
    background: linear-gradient(
        90deg,
        #a33df4,
        transparent
    );
}

.tagline-text {
    color: #c48aff;
    font-size: clamp(15px, 4vw, 22px);
    font-weight: 500;
    letter-spacing: 6px;
    white-space: nowrap;
}

/* Supporting description */

.description {
    max-width: 410px;
    margin-top: 39px;
    font-size: 12px;
    line-height: 2;
    font-weight: 300;
    letter-spacing: .35px;
    color: rgba(224, 207, 243, .48);
    text-align: center;
}

/* Small bottom detail */

.bottom-detail {
    position: absolute;
    bottom: 27px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(195, 159, 225, .22);
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

/* Animations */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes logoGlow {
    0%, 100% {
        box-shadow:
            0 0 15px rgba(181, 49, 255, .55),
            0 0 45px rgba(147, 35, 255, .3);
    }

    50% {
        box-shadow:
            0 0 25px rgba(181, 49, 255, .8),
            0 0 65px rgba(147, 35, 255, .48);
    }
}

/* Mobile adjustments */

@media (max-width: 480px) {

    .logo-circle {
        width: 120px;
        height: 120px;
        margin-bottom: 26px;
    }

    .logo-circle svg {
        width: 77px;
        height: 77px;
    }

    .brand-name {
        letter-spacing: -1.8px;
    }

    .tagline {
        gap: 11px;
        margin-top: 16px;
    }

    .tagline-text {
        letter-spacing: 4px;
    }

    .description {
        margin-top: 30px;
        font-size: 11px;
        max-width: 320px;
        line-height: 1.9;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}

</style>
</head>

<body>

<main class="landing">

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="curve curve-top"></div>
    <div class="curve curve-bottom"></div>

    <section class="brand">

        <!-- Circular speech bubble and keyhole logo -->

        <div class="logo-circle">

            <svg viewBox="0 0 100 100"
                 xmlns="http://www.w3.org/2000/svg"
                 aria-label="Anonymous speech bubble keyhole logo"
                 role="img">

                <path
                    d="M50 9
                       C27 9 9 25 9 47
                       C9 68 25 84 47 85
                       L29 98
                       L62 84
                       C82 79 93 64 93 46
                       C93 25 74 9 50 9Z"
                    fill="white"
                />

                <circle
                    cx="51"
                    cy="42"
                    r="11"
                    fill="#180821"
                />

                <path
                    d="M47 49
                       L40 72
                       L62 72
                       L55 49Z"
                    fill="#180821"
                />

            </svg>

        </div>

        <h1 class="brand-name">Anonymous</h1>

        <div class="tagline">

            <span class="tagline-line"></span>

            <span class="tagline-text">Say It Here</span>

            <span class="tagline-line"></span>

        </div>

        <p class="description">
            A space to share confessions, secrets and thoughts anonymously.
            Read real stories, express yourself and say what you can't say
            anywhere else.
        </p>

    </section>

    <div class="bottom-detail">
        Your space. Your voice. Your anonymity.
    </div>

</main>

<script>
    // Automatically continue to the existing homepage.

    window.setTimeout(function() {
        window.location.replace("/");
    }, 4000);
</script>

</body>
</html>
